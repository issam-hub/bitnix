services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bitnix
      POSTGRES_PASSWORD: bitnix
      POSTGRES_DB: bitnix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitnix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bitnix-network
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bitnix-network

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - bitnix-network

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - bitnix-network

  games-catalog-api:
    ports:
      - "3080:3080"
    build:
      dockerfile: game-catalog.dockerfile
      context: .
    env_file:
      - .env
    environment:
      - HTTP_PORT=3080
      - DSN=postgres://bitnix:bitnix@postgres:5432/bitnix?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bitnix-network

  user-review-api:
    ports:
      - "3081:3081"
    build:
      dockerfile: userService/user-review.dockerfile
      context: userService
    env_file:
      - userService/.env
    environment:
      - HTTP_PORT=3081
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
      - kafka
    networks:
      - bitnix-network

networks:
  bitnix-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
