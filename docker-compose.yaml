services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bitnix
      POSTGRES_PASSWORD: bitnix
      POSTGRES_DB: bitnix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitnix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bitnix-network
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bitnix-network

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/2181; echo srvr >&3; head -n 1 <&3 | grep -qi zookeeper'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - bitnix-network

  kafka:
    image: bitnamilegacy/kafka:3.3.1-debian-11-r9
    platform: linux/amd64
    ports:
      - "19092:9092"
    environment:
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - bitnix-network


  games-catalog-api:
    ports:
      - "3080:3080"
    build:
      dockerfile: game-catalog.dockerfile
      context: coreService
    env_file:
      - coreService/.env
    environment:
      - HTTP_PORT=3080
      - DSN=postgres://bitnix:bitnix@postgres:5432/bitnix?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - bitnix-network

  user-review-api:
    ports:
      - "3081:3081"
    build:
      dockerfile: user-review.dockerfile
      context: userService
    env_file:
      - userService/.env
    command: ["/app/userReviewServices"]
    environment:
      - HTTP_PORT=3081
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
      - kafka
    networks:
      - bitnix-network

networks:
  bitnix-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
